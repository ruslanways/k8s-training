apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: training-app
spec:
  ingressClassName: nginx
  rules:
    - host: training.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: training-app
                port:
                  number: 80
